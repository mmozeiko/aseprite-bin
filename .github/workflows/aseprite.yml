name: aseprite

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, leave empty for latest"
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: arch
            container: archlinux:latest
          - os: windows-2025
            name: windows

    runs-on: ${{ matrix.os }}

    container: ${{ matrix.container || null }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev

      - name: Install dependencies (Arch)
        if: matrix.name == 'arch'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel cmake ninja git libx11 libxcursor libxi mesa fontconfig

      - name: Build (Windows)
        if: matrix.name == 'windows'
        id: build-windows
        shell: cmd
        run: call build.cmd
        env:
          ASEPRITE_VERSION: ${{ github.event.inputs.version }}

      - name: Build (Unix)
        if: matrix.name != 'windows'
        id: build-unix
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          ASEPRITE_VERSION: ${{ github.event.inputs.version }}

      - name: Archive (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.build-windows.outputs.ASEPRITE_VERSION }}-${{ matrix.name }}
          path: github
          if-no-files-found: error

      - name: Archive (Unix)
        if: matrix.name != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.build-unix.outputs.ASEPRITE_VERSION }}-${{ matrix.name }}
          path: github
          if-no-files-found: error
